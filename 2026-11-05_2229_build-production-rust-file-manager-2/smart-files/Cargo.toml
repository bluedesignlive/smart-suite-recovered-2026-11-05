[workspace]
resolver = "2"
members = ["crates/smart-core", "crates/smart-ui-egui", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true

[profile.dev]
opt-level = 1

# Sandbox-friendly profiles (2-core CI): fast iteration, same codegen as release elsewhere.
[profile.wasmfast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 2
strip = false

[profile.nativefast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 2
strip = false
