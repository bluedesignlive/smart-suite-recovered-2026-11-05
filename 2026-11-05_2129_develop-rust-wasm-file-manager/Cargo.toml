[workspace]
resolver = "2"
members = ["crates/smart-core", "crates/smart-ui-egui", "crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"   # a panicking worker must not take the whole file manager down
strip = true

[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
panic = "abort"    # wasm32 has no unwinding

# low-memory machines: same code, lighter link step (used when fat LTO would exhaust RAM)
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
