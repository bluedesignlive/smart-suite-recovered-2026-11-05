<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Files — a native Rust file manager (WebAssembly)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0f1522; overflow: hidden; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #9fb0cc; font: 500 14px system-ui, sans-serif; letter-spacing: .02em; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="smart_canvas"></canvas>
    <div id="boot">Loading Smart Files…</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
