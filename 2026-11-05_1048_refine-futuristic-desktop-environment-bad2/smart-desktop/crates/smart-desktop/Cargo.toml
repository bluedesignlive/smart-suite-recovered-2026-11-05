[package]
name = "smart-desktop"
description = "egui frontend for Smart Files (desktop + WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "smart-desktop-bin"
path = "src/main.rs"

[features]
default = ["audio"]
audio = ["smart-core/audio"]

[dependencies]
smart-core = { path = "../smart-core", default-features = true }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.37"
vt100 = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "HtmlCanvasElement", "Element", "console", "Location", "Storage", "Navigator",
  "Request", "RequestInit", "Response", "Headers",
  "AudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioDestinationNode", "AudioNode", "AudioParam", "GainNode",
  "SpeechSynthesis", "SpeechSynthesisUtterance", "SpeechSynthesisVoice",
  "MediaDevices", "MediaStream", "MediaStreamConstraints", "MediaRecorder", "BlobEvent", "Blob", "BlobPropertyBag", "Url",
  "HtmlElement", "HtmlInputElement", "HtmlVideoElement", "HtmlMediaElement", "HtmlAnchorElement", "CssStyleDeclaration",
  "File", "FileList", "FileReader", "Event", "EventTarget", "Node", "ProgressEvent", "DisplayMediaStreamConstraints"
] }
console_error_panic_hook = "0.1"
